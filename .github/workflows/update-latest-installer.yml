name: Verify installer package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test plugin source
        run: |
          node tests/test_logic.mjs
          node tests/validate_source.mjs

      - name: Install Qt test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtquick-shapes qml6-module-qtqml-workerscript qml6-module-qttest qml6-module-qtcore

      - name: Test native QML controls and runtime with host fakes
        run: ./scripts/test_qml.sh

      - name: Build installers
        run: ./build.sh

      - name: Verify installer metadata
        run: |
          VERSION="$(awk -F= '$1 == "version" { print $2 }' plugin/deeppipe-mobile/metadata.txt)"
          test -n "$VERSION"
          test "$(unzip -p "dist/deeppipe-mobile-v${VERSION}.zip" metadata.txt | awk -F= '$1 == "version" { print $2 }')" = "$VERSION"
          cmp "dist/deeppipe-mobile-v${VERSION}.zip" dist/deeppipe-mobile-latest.zip

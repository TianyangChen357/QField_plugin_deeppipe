name: Update latest installer

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "build.sh"
      - ".github/workflows/update-latest-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-installer
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test plugin source
        run: |
          node tests/test_logic.mjs
          node tests/validate_source.mjs

      - name: Build installers
        run: ./build.sh

      - name: Commit updated installers
        run: |
          if git diff --quiet -- dist/; then
            echo "Installer files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/deeppipe-mobile-*.zip
          git commit -m "Update QField installer artifacts"
          git push

name: Verify installer package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test plugin source
        run: |
          node tests/test_logic.mjs
          node tests/validate_source.mjs

      - name: Build installers
        run: ./build.sh

      - name: Verify installer metadata
        run: |
          VERSION="$(awk -F= '$1 == "version" { print $2 }' plugin/deeppipe-mobile/metadata.txt)"
          test -n "$VERSION"
          test "$(unzip -p "dist/deeppipe-mobile-v${VERSION}.zip" metadata.txt | awk -F= '$1 == "version" { print $2 }')" = "$VERSION"
          cmp "dist/deeppipe-mobile-v${VERSION}.zip" dist/deeppipe-mobile-latest.zip
          TEMPLATE_VERSION="$(python3 -c 'import json; print(json.load(open("project-template/template.json"))["template_version"])')"
          cmp "dist/deeppipe-qfield-template-v${TEMPLATE_VERSION}.zip" dist/deeppipe-qfield-template-latest.zip
          unzip -tq dist/deeppipe-qfield-template-latest.zip

  project-template:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install native QGIS test runtime
        run: |
          apt-get update
          apt-get install -y python3-qgis

      - name: Test portable project and editable data
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_project_template.py

  native-qml:
    runs-on: ubuntu-latest
    # QtCore.Settings requires Qt >= 6.5. Ubuntu's default Qt 6.4 cannot
    # instantiate the shipped runtime; use the same Qt 6.8 baseline as local QA.
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt test runtime
        run: |
          apt-get update
          apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtquick-shapes qml6-module-qtqml-workerscript qml6-module-qttest qml6-module-qtcore

      - name: Test native QML controls and runtime with host fakes
        run: ./scripts/test_qml.sh
